<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>01</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== 비번: 안쓸듯? ===== -->
<div id="gate" class="layer">
  <div class="gate-box">
    <p class="gate-code">404</p>
    <p class="gate-msg">not found</p>
    <input type="password" id="gate-input" autocomplete="off" spellcheck="false">
    <button id="gate-submit" type="button">확인</button>
    <p class="gate-error" id="gate-error"></p>
  </div>
</div>

<!-- =====타이틀화면 ===== -->
<div id="title" class="layer hidden">
  <div class="title-vignette"></div>
  <div class="title-inner">
    <h1 class="title-main" id="t-main"></h1>
    <p class="title-sub" id="t-sub"></p>
    <nav class="title-menu">
      <button type="button" data-act="start">START</button>
      <button type="button" data-act="continue">CONTINUE</button>
      <button type="button" data-act="config">CONFIG</button>
    </nav>
    <p class="title-note" id="t-note"></p>
  </div>
</div>

<!-- ===== 본편 ===== -->
<main id="stage" class="layer hidden">

  <div id="bg-wrap">
    <video id="bg-video" muted loop playsinline preload="auto"></video>
    <div id="bg-tint"></div>
    <div id="bg-grain"></div>
    <div id="bg-vignette"></div>
  </div>

  <div id="textbox" class="hidden">
    <div id="speaker" class="hidden"></div>
    <div id="dialogue"></div>
    <div id="next-arrow" class="hidden">▼</div>
  </div>

  <div id="controls">
    <button type="button" data-act="auto">AUTO</button>
    <button type="button" data-act="skip">SKIP</button>
    <button type="button" data-act="backlog">LOG</button>
    <button type="button" data-act="config">CONFIG</button>
    <button type="button" data-act="quit">TITLE</button>
  </div>

  <div id="curtain"></div>
</main>

<!-- ===== 로그 ===== -->
<div id="backlog" class="layer hidden">
  <div class="panel">
    <h2>LOG</h2>
    <div id="backlog-list"></div>
    <button type="button" class="panel-close">닫기</button>
  </div>
</div>

<!-- ===== 설정 ===== -->
<div id="config" class="layer hidden">
  <div class="panel">
    <h2>CONFIG</h2>
    <label><span>텍스트 속도</span><input type="range" id="cfg-speed" min="0" max="100" value="58"></label>
    <label><span>오토 대기</span><input type="range" id="cfg-auto" min="300" max="4000" step="100" value="1500"></label>
    <label><span>환경음</span><input type="range" id="cfg-bgm" min="0" max="100" value="55"></label>
    <label><span>효과음</span><input type="range" id="cfg-se" min="0" max="100" value="70"></label>
    <button type="button" class="panel-close">닫기</button>
  </div>
</div>

<!-- ===== 엔딩...굳이? ===== -->
<div id="ending" class="layer hidden">
  <div class="ending-inner">
    <p id="ending-line1">서버와의 연결이 끊어졌습니다.</p>
    <p id="ending-line2">404 not found</p>
    <button type="button" id="ending-replay">다시 읽기</button>
  </div>
</div>

<!-- 오디오 -->
<audio id="a-waves" loop preload="auto"></audio>
<audio id="a-step" preload="auto"></audio>

<script src="scenario.js"></script>
<script src="script.js"></script>
</body>
</html>
